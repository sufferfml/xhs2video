name: Verify release candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/smoke.py
      - run: uv run --locked python scripts/check_release.py --history
      - run: uv build
      - run: uv run --locked python scripts/check_release.py --archive dist/xhs_video_mcp-0.2.0a1.tar.gz --archive dist/xhs_video_mcp-0.2.0a1-py3-none-any.whl
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.5
      - run: uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
      - run: uvx pip-audit==2.10.1 -r requirements-audit.txt --disable-pip --no-deps --require-hashes --progress-spinner off
